<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наш Класс | Воспоминания</title>
    <style>
        body {
            margin: 0;
            background-color: #1a261a; 
            color: #e0e0e0;
            font-family: 'Comic Sans MS', cursive, sans-serif; /* Похоже на рукописный */
            padding: 15px;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Фоновые фото из твоего списка */
        .bg-photo {
            position: fixed;
            z-index: -1;
            opacity: 0.3;
            width: 200px;
            border: 6px solid #fff;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        .p2 { top: 10%; right: -30px; transform: rotate(15deg); }
        .p3 { top: 40%; left: -40px; transform: rotate(-10deg); }
        .p4 { bottom: 10%; right: -20px; transform: rotate(5deg); }

        .container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin: 30px 0;
            border: 2px dashed #ffffff44;
            padding: 20px;
            border-radius: 15px;
            background: rgba(0,0,0,0.2);
        }

        h1 {
            font-size: 1.8rem;
            color: #fff;
            text-shadow: 2px 2px 0px #444; /* Эффект мела */
            margin: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #ffffff22;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }
        
        video {
            width: 100%;
            display: block;
        }

        .label {
            padding: 10px;
            text-align: center;
            font-size: 0.9rem;
            color: #f0f0f0;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            opacity: 0.6;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <img src="bg2.jpg" class="bg-photo p2">
    <img src="bg3.jpg" class="bg-photo p3">
    <img src="bg4.jpg" class="bg-photo p4">

    <div class="container">
        <header>
            <h1>✏️ Наш Школьный Альбом</h1>
            <p>Самые теплые моменты</p>
        </header>

        <div class="grid">
            <div class="card"><video controls playsinline preload="metadata"><source src="vid2.mp4" type="video/mp4"></video><div class="label">Момент 2</div></div>
            <div class="card"><video controls playsinline preload="metadata"><source src="vid7.mp4" type="video/mp4"></video><div class="label">Момент 7</div></div>
            <div class="card"><video controls playsinline preload="metadata"><source src="vid8.mp4" type="video/mp4"></video><div class="label">Момент 8</div></div>
            <div class="card"><video controls playsinline preload="metadata"><source src="vid10.mp4" type="video/mp4"></video><div class="label">Момент 10</div></div>
            <div class="card"><video controls playsinline preload="metadata"><source src="vid11.mp4" type="video/mp4"></video><div class="label">Момент 11</div></div>
            <div class="card"><video controls playsinline preload="metadata"><source src="vid12.mp4" type="video/mp4"></video><div class="label">Момент 12</div></div>
            <div class="card"><video controls playsinline preload="metadata"><source src="vid13.mp4" type="video/mp4"></video><div class="label">Момент 13</div></div>
            <div class="card"><video controls playsinline preload="metadata"><source src="vid14.mp4" type="video/mp4"></video><div class="label">Момент 14</div></div>
            <div class="card"><video controls playsinline preload="metadata"><source src="vid15.mp4" type="video/mp4"></video><div class="label">Момент 15</div></div>
            <div class="card"><video controls playsinline preload="metadata"><source src="vid17.mp4" type="video/mp4"></video><div class="label">Момент 17</div></div>
            <div class="card"><video controls playsinline preload="metadata"><source src="vid18.mp4" type="video/mp4"></video><div class="label">Момент 18</div></div>
            <div class="card"><video controls playsinline preload="metadata"><source src="vid19.mp4" type="video/mp4"></video><div class="label">Момент 19</div></div>
            <div class="card"><video controls playsinline preload="metadata"><source src="vid20.mp4" type="video/mp4"></video><div class="label">Момент 20</div></div>
        </div>

        <footer>
            Храним историю нашего класса ❤️
        </footer>
    </div>

</body>
</html>
